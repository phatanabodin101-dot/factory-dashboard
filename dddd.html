<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Factory Monitoring Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a1a;
      color: white;
      margin: 0;
      padding: 20px;
    }
    
    /* แถบสรุปจำนวนด้านบนสุด */
    .summary-bar {
      display: flex;
      justify-content: space-around;
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .status-normal { color: #4CAF50; }
    .status-alarm { color: #f44336; animation: blink 1s infinite; }

    /* หัวข้อแผนก */
    .dept-header {
      background: linear-gradient(90deg, #333333, #1a1a1a);
      padding: 10px 15px;
      border-left: 5px solid #00bcd4;
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 15px;
      border-radius: 4px;
    }

    /* จัดตารางกล่อง (CSS Grid) */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 10px;
      margin-bottom: 30px;
    }

    /* สไตล์กล่องแต่ละเครื่อง */
    .machine-card {
      background-color: #4CAF50; /* สีเขียวปกติ */
      height: 65px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: background-color 0.3s ease;
    }

    /* สถานะเมื่อ Alarm */
    .machine-card.alarm {
      background-color: #f44336 !important; /* สีแดง */
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <!-- แถบสรุปสถานะรวม -->
  <div class="summary-bar">
    <div>รวมทั้งหมด: <span id="totalCount">80</span> เครื่อง</div>
    <div>ปกติ: <span id="normalCount" class="status-normal">80</span></div>
    <div>ALARM: <span id="alarmCount" class="status-alarm">0</span></div>
  </div>

  <!-- แผนกที่ 1: หักเม็ด -->
  <div class="dept-header" style="border-left-color: #00bcd4;">
    🏭 แผนกหักเม็ด (42 เครื่อง: M1 - M42)
  </div>
  <div class="grid-container" id="gridHakMed"></div>

  <!-- แผนกที่ 2: หักแท่ง -->
  <div class="dept-header" style="border-left-color: #ff9800;">
    🏭 แผนกหักแท่ง (38 เครื่อง: M1 - M38)
  </div>
  <div class="grid-container" id="gridHakThang"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // 1. ใส่ Config จาก Firebase ของคุณ
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const gridMed = document.getElementById('gridHakMed');
    const gridThang = document.getElementById('gridHakThang');

    // 2. สร้างกล่อง แผนกหักเม็ด (med_m1 ถึง med_m42)
    for (let i = 1; i <= 42; i++) {
      gridMed.appendChild(createCard(`med_m${i}`, `M${i}`));
    }

    // 3. สร้างกล่อง แผนกหักแท่ง (thang_m1 ถึง thang_m38)
    for (let i = 1; i <= 38; i++) {
      gridThang.appendChild(createCard(`thang_m${i}`, `M${i}`));
    }

    // ฟังก์ชันสร้าง Element กล่อง
    function createCard(dataKey, displayLabel) {
      const card = document.createElement('div');
      card.id = `card-${dataKey}`;
      card.className = 'machine-card';
      card.innerHTML = `
        <div style="font-size: 13px; opacity: 0.85;">${displayLabel}</div>
        <div id="status-${dataKey}" style="font-size: 15px;">OK</div>
      `;
      return card;
    }

    // 4. ดักฟังค่าจาก Firebase
    const statusRef = ref(db, 'status');
    
    onValue(statusRef, (snapshot) => {
      const data = snapshot.val() || {};
      let alarmCount = 0;
      let normalCount = 0;

      // ฟังก์ชันช่วยอัปเดตสีกล่อง
      const updateStatus = (dataKey) => {
        const isAlarm = data[dataKey] === 1;
        const card = document.getElementById(`card-${dataKey}`);
        const text = document.getElementById(`status-${dataKey}`);

        if (card && text) {
          if (isAlarm) {
            card.className = 'machine-card alarm';
            text.innerText = 'ALARM';
            alarmCount++;
          } else {
            card.className = 'machine-card';
            text.innerText = 'OK';
            normalCount++;
          }
        }
      };

      // เช็กค่าของแผนกหักเม็ด (42 เครื่อง)
      for (let i = 1; i <= 42; i++) {
        updateStatus(`med_m${i}`);
      }

      // เช็กค่าของแผนกหักแท่ง (38 เครื่อง)
      for (let i = 1; i <= 38; i++) {
        updateStatus(`thang_m${i}`);
      }

      // อัปเดตตัวเลขสรุปด้านบน
      document.getElementById('normalCount').innerText = normalCount;
      document.getElementById('alarmCount').innerText = alarmCount;
    });
  </script>

</body>
</html>
