<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factory Monitoring Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a1a;
      color: white;
      margin: 0;
      padding: 20px;
    }
    
    .summary-bar {
      display: flex;
      justify-content: space-around;
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .status-normal { color: #4CAF50; }
    .status-alarm { color: #f44336; animation: blink 1s infinite; }

    .dept-header {
      background: linear-gradient(90deg, #333333, #1a1a1a);
      padding: 10px 15px;
      border-left: 5px solid #00bcd4;
      font-size: 20px;
      font-weight: bold;
      margin-top: 25px;
      margin-bottom: 15px;
      border-radius: 4px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      margin-bottom: 25px;
    }

    .machine-card {
      background-color: #4CAF50;
      height: 60px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: background-color 0.3s ease;
    }

    .machine-card.alarm {
      background-color: #f44336 !important;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    /* ตารางประวัติย้อนหลัง */
    .history-card {
      background-color: #2a2a2a;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      margin-top: 30px;
    }
    .table-responsive {
      max-height: 500px;
      overflow-y: auto;
      margin-top: 15px;
    }
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }
    .history-table th, .history-table td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #444;
    }
    .history-table th {
      background-color: #333;
      color: #00bcd4;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .history-table tr:hover {
      background-color: #383838;
    }
    .badge-alarm {
      background-color: #f44336;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-ok {
      background-color: #4CAF50;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    /* สไตล์เวลา Downtime */
    .downtime-text {
      display: block;
      margin-top: 5px;
      font-size: 13px;
      color: #ffeb3b; /* สีเหลืองเด่นๆ */
    }
  </style>
</head>
<body>

  <div class="summary-bar">
    <div>รวมทั้งหมด: <span id="totalCount">80</span> เครื่อง</div>
    <div>ปกติ: <span id="normalCount" class="status-normal">80</span></div>
    <div>ALARM: <span id="alarmCount" class="status-alarm">0</span></div>
  </div>

  <div class="dept-header" style="border-left-color: #00bcd4;">🏭 แผนกหักเม็ด (42 เครื่อง: M1 - M42)</div>
  <div class="grid-container" id="gridHakMed"></div>

  <div class="dept-header" style="border-left-color: #ff9800;">🏭 แผนกหักแท่ง (38 เครื่อง: M1 - M38)</div>
  <div class="grid-container" id="gridHakThang"></div>

  <div class="history-card">
    <div style="font-size: 20px; font-weight: bold; color: #00bcd4;">
      📜 ประวัติการแจ้งเตือนและระยะเวลาหยุดเครื่อง (80 รายการล่าสุด)
    </div>
    
    <div class="table-responsive">
      <table class="history-table">
        <thead>
          <tr>
            <th>วัน - เวลา</th>
            <th>แผนก</th>
            <th>เครื่องจักร</th>
            <th>สถานะ / เวลาหยุด</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
          <tr>
            <td colspan="4" style="color: #aaa;">กำลังโหลดข้อมูลประวัติ...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // 1. ใส่ Config จาก Firebase ของคุณ
    const firebaseConfig = {
      apiKey: "AIzaSyC7qrwVsl_F4zgCVnfMwvBxxdA_AfDCG04",
      databaseURL: "https://factory-monitoring-65f56-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const gridMed = document.getElementById('gridHakMed');
    const gridThang = document.getElementById('gridHakThang');

    for (let i = 1; i <= 42; i++) gridMed.appendChild(createCard(`med_m${i}`, `M${i}`));
    for (let i = 1; i <= 38; i++) gridThang.appendChild(createCard(`thang_m${i}`, `M${i}`));

    function createCard(dataKey, displayLabel) {
      const card = document.createElement('div');
      card.id = `card-${dataKey}`;
      card.className = 'machine-card';
      card.innerHTML = `<div style="font-size: 13px; opacity: 0.85;">${displayLabel}</div><div id="status-${dataKey}" style="font-size: 15px;">OK</div>`;
      return card;
    }

    // อัปเดตสถานะเครื่องแบบเรียลไทม์
    onValue(ref(db, 'status'), (snapshot) => {
      const data = snapshot.val() || {};
      let alarmCount = 0; let normalCount = 0;

      const updateStatus = (dataKey) => {
        const isAlarm = data[dataKey] === 1;
        const card = document.getElementById(`card-${dataKey}`);
        const text = document.getElementById(`status-${dataKey}`);
        if (card && text) {
          if (isAlarm) {
            card.className = 'machine-card alarm'; text.innerText = 'ALARM'; alarmCount++;
          } else {
            card.className = 'machine-card'; text.innerText = 'OK'; normalCount++;
          }
        }
      };

      for (let i = 1; i <= 42; i++) updateStatus(`med_m${i}`);
      for (let i = 1; i <= 38; i++) updateStatus(`thang_m${i}`);
      document.getElementById('normalCount').innerText = normalCount;
      document.getElementById('alarmCount').innerText = alarmCount;
    });

    // ----------------------------------------------------
    // ฟังก์ชันแปลงข้อความเวลา (15/08/2026 14:30:05) เป็นมิลลิวินาที
    // ----------------------------------------------------
    function parseTimestamp(ts) {
      if (!ts) return 0;
      const parts = ts.split(' ');
      if (parts.length === 2) {
        const d = parts[0].split('/'); // วัน/เดือน/ปี
        const t = parts[1].split(':'); // ชั่วโมง:นาที:วินาที
        if (d.length === 3 && t.length >= 2) {
          return new Date(d[2], d[1] - 1, d[0], t[0], t[1], t[2] || 0).getTime();
        }
      }
      return 0;
    }

    // ----------------------------------------------------
    // ดักฟัง Logs และคำนวณระยะเวลา (ดึงมาเผื่อ 200 โชว์แค่ 80)
    // ----------------------------------------------------
    const logsQuery = query(ref(db, 'logs'), limitToLast(200));
    
    onValue(logsQuery, (snapshot) => {
      const data = snapshot.val();
      const tbody = document.getElementById('historyTableBody');
      tbody.innerHTML = '';

      if (!data) {
        tbody.innerHTML = `<tr><td colspan="4" style="color: #888;">ยังไม่มีประวัติ</td></tr>`;
        return;
      }

      const rawLogs = Object.keys(data).map(key => data[key]);
      let activeAlarms = {};
      let processedLogs = [];

      // วนลูปจับคู่เวลาเพื่อหาผลต่าง
      rawLogs.forEach(log => {
        const machineKey = (log.dept || '') + '_' + (log.machine || '');
        let downtimeStr = '';
        const isAlarm = log.status === 'ALARM' || log.status === 1;
        const isOk = log.status === 'OK' || log.status === 0;

        if (isAlarm) {
          // เก็บเวลาเริ่มต้นเมื่อเกิด Alarm
          activeAlarms[machineKey] = parseTimestamp(log.timestamp);
        } else if (isOk) {
          // ถ้ากลับมา OK ให้เอาเวลามาลบกัน
          if (activeAlarms[machineKey]) {
            const startTime = activeAlarms[machineKey];
            const endTime = parseTimestamp(log.timestamp);
            
            if (startTime > 0 && endTime > startTime) {
              const diffMs = endTime - startTime;
              const diffMins = Math.floor(diffMs / 60000);
              const diffSecs = Math.floor((diffMs % 60000) / 1000);
              
              if (diffMins > 0) {
                downtimeStr = `(หยุดไป ${diffMins} นาที ${diffSecs} วินาที)`;
              } else {
                downtimeStr = `(หยุดไป ${diffSecs} วินาที)`;
              }
            }
            delete activeAlarms[machineKey]; // เคลียร์ค่า
          }
        }

        processedLogs.push({ ...log, downtimeStr, isAlarm });
      });

      // พลิกเอาใหม่สุดขึ้นก่อน แล้วตัดมาโชว์แค่ 80 บรรทัด
      const displayLogs = processedLogs.reverse().slice(0, 80);

      displayLogs.forEach(log => {
        const tr = document.createElement('tr');
        
        // จัดการหน้าตาสถานะและเวลาหยุด
        let statusHtml = '';
        if (log.isAlarm) {
          statusHtml = `<span class="badge-alarm">🚨 ALARM</span>`;
        } else {
          statusHtml = `<span class="badge-ok">✅ ปกติ (OK)</span>`;
          // ถ้ามีเวลาหยุดที่คำนวณไว้ ให้แสดงตัวหนังสือสีเหลืองใต้ป้าย OK
          if (log.downtimeStr) {
            statusHtml += `<span class="downtime-text">⏱️ ${log.downtimeStr}</span>`;
          }
        }

        tr.innerHTML = `
          <td>${log.timestamp || '-'}</td>
          <td>${log.dept || '-'}</td>
          <td>${log.machine || '-'}</td>
          <td>${statusHtml}</td>
        `;
        tbody.appendChild(tr);
      });
    });
  </script>

</body>
</html>
